name: Update README stats

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-stats.yml

concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=tokyonight&show_icons=true&show=reviews
          path: profile/stats.svg
          # Optional: add a PAT as the STATS_TOKEN secret to include private contributions.
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          # Keep the last good card instead of committing an error card (e.g. on rate limits).
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
